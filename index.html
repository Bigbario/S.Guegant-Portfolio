<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Guegant Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Orbitron:wght@700;900&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            cursor: none !important;
        }

        body {
            /* Fond HUD Sci-Fi / Fantasy Néon Violet */
            background-color: #0b021a;
            background-image: 
                radial-gradient(circle at center, rgba(140, 30, 255, 0.25) 0%, rgba(10, 2, 25, 0.95) 75%),
                linear-gradient(to right, rgba(180, 50, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(180, 50, 255, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 45px 45px, 45px 45px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            position: relative;
            padding: 4vh 0 4vh 0;
        }

        /* --- CURSEUR SPRITESHEET ANIMÉ --- */
        #customCursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 48px;
            height: 48px;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            background-image: url('images/MouseIconIdle.png');
            background-size: 300% 100%;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            animation: walkCycle 0.6s steps(3) infinite;
        }

        @keyframes walkCycle {
            0% { background-position: 0% 0%; }
            100% { background-position: 150% 0%; }
        }

        /* Canvas pour particules */
        #effectsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* --- TITRE --- */
        .title-container {
            text-align: center;
            position: relative;
            z-index: 5;
            margin-top: 1vh;
            width: 90vw;
            max-width: 1200px;
        }

        .main-title {
            font-family: 'Pacifico', cursive;
            font-size: 7.5rem;
            color: #ffffff;
            margin-bottom: -15px;
            text-shadow: 0 0 25px rgba(180, 50, 255, 0.7), 0 5px 20px rgba(0,0,0,0.9);
            line-height: 1.1;
        }

        .subtitle {
            font-family: 'Pacifico', cursive;
            font-size: 4.2rem;
            color: #d488ff;
            text-shadow: 0 0 20px rgba(180, 50, 255, 0.9), 0 4px 15px rgba(0,0,0,0.8);
        }

        /* --- MENU HUD : Centré et agrandi --- */
        .game-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 26px;
            z-index: 5;
            width: 100%;
            max-width: 750px;
            flex-grow: 1;
            margin-bottom: 6vh;
        }

        .menu-btn {
            background: linear-gradient(135deg, rgba(120, 20, 180, 0.4), rgba(40, 5, 60, 0.7));
            border: 2px solid rgba(190, 80, 255, 0.6);
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Orbitron', 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 0 15px rgba(160, 30, 255, 0.3), inset 0 0 12px rgba(180, 50, 255, 0.2);
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
            width: 88%;
            display: block;
        }

        .btn-projets {
            font-size: 2.6rem;
            padding: 22px 0;
        }

        .btn-demo {
            font-size: 2.2rem;
            padding: 18px 0;
        }

        .btn-about {
            font-size: 1.8rem;
            padding: 16px 0;
        }

        .menu-btn:hover {
            background: linear-gradient(135deg, rgba(170, 40, 255, 0.7), rgba(80, 10, 120, 0.9));
            border-color: #ffffff;
            color: #ffffff;
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 30px rgba(200, 80, 255, 0.8), inset 0 0 18px rgba(255, 255, 255, 0.5);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        }

        /* --- MODAL VIDEO DEMO REEL (AGRANDIE) --- */
        .video-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 2, 26, 0.88);
            backdrop-filter: blur(10px);
            z-index: 9000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .video-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .video-container {
            width: 94vw;
            max-width: 1600px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 2px solid rgba(190, 80, 255, 0.8);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(180, 50, 255, 0.7);
            position: relative;
            transform: scale(0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .video-modal-overlay.active .video-container {
            transform: scale(1);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            background: rgba(140, 30, 255, 0.4);
            border: 1px solid rgba(190, 80, 255, 0.8);
            padding: 6px 16px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(180, 50, 255, 0.8);
            color: #fff;
            box-shadow: 0 0 15px rgba(220, 160, 255, 0.8);
        }

        /* Slash / Magie au clic */
        .slash-effect {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            border-top-color: #d488ff;
            border-right-color: transparent;
            transform: translate(-50%, -50%) rotate(-45deg) scale(0.2);
            animation: slashAnim 0.22s ease-out forwards;
        }

        @keyframes slashAnim {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-45deg) scale(0.3);
                box-shadow: 0 0 15px #d488ff;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(135deg) scale(1.3);
                box-shadow: 0 0 0px transparent;
            }
        }
    </style>
</head>
<body>

    <!-- Curseur suiveur -->
    <div id="customCursor"></div>

    <canvas id="effectsCanvas"></canvas>

    <!-- Titre -->
    <div class="title-container" id="titleContainer">
        <h1 class="main-title">Samuel Guegant</h1>
        <h2 class="subtitle">Portfolio</h2>
    </div>

    <!-- Menu style HUD -->
    <nav class="game-menu">
        <a href="#projets" class="menu-btn btn-projets">PROJETS</a>
        <a href="#demoreel" class="menu-btn btn-demo" id="demoReelBtn">DEMO REEL</a>
        <a href="#about" class="menu-btn btn-about">ABOUT ME</a>
    </nav>

    <!-- Modal lecteur vidéo Démo Reel -->
    <div class="video-modal-overlay" id="videoModal">
        <div class="video-container">
            <button class="close-btn" id="closeVideoBtn">FERMER [X]</button>
            <iframe id="youtubeIframe" src="" title="Demo Reel Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------------------
        // GESTION DU CURSEUR SUIVEUR
        // -------------------------------------------------------------------------
        const customCursor = document.getElementById('customCursor');

        window.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        });

        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');
        const titleContainer = document.getElementById('titleContainer');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // -------------------------------------------------------------------------
        // 1. PARTICULES DE FOND VIOLETTES / LUMINEUSES
        // -------------------------------------------------------------------------
        const bgParticles = [];
        const BG_PARTICLE_COUNT = 45;

        for (let i = 0; i < BG_PARTICLE_COUNT; i++) {
            bgParticles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                speedY: 0.2 + Math.random() * 0.4,
                speedX: (Math.random() - 0.5) * 0.2,
                opacity: Math.random() * 0.7 + 0.2,
                baseOpacity: Math.random() * 0.7 + 0.2,
                pulseSpeed: 0.01 + Math.random() * 0.02,
                size: Math.random() * 3 + 1.5
            });
        }

        function updateAndDrawBgParticles(frameCount) {
            for (let p of bgParticles) {
                p.y -= p.speedY;
                p.x += p.speedX;
                p.opacity = p.baseOpacity + Math.sin(frameCount * p.pulseSpeed) * 0.2;

                if (p.y < -20) {
                    p.y = height + 10;
                    p.x = Math.random() * width;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.opacity);
                
                const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                grad.addColorStop(0, 'rgba(220, 160, 255, 0.9)');
                grad.addColorStop(1, 'rgba(140, 30, 255, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // -------------------------------------------------------------------------
        // 2. ANIMATION TITRE & THANOS DUST
        // -------------------------------------------------------------------------
        let titleState = 'fade_in';
        let titleTimer = 0;
        let titleOpacity = 0;
        const dustParticles = [];

        function spawnTitleDust(intensity) {
            const rect = titleContainer.getBoundingClientRect();
            
            const rx = (Math.random() - 0.5) * (rect.width || 600);
            const ry = (Math.random() - 0.5) * (rect.height || 150);

            dustParticles.push({
                x: (rect.left + (rect.width / 2) || width / 2) + rx,
                y: (rect.top + (rect.height / 2) || height / 4) + ry,
                vx: (Math.random() * 1.8 + 0.4) * intensity,
                vy: -(Math.random() * 1.6 + 0.4) * intensity,
                opacity: 200,
                life: 45 + Math.random() * 30,
                size: Math.floor(2 + Math.random() * 3)
            });
        }

        function updateDustParticles() {
            for (let i = dustParticles.length - 1; i >= 0; i--) {
                const p = dustParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.opacity -= 4;
                p.life--;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.opacity / 255);
                ctx.fillStyle = 'rgba(212, 136, 255, 0.85)';
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();

                if (p.opacity <= 0 || p.life <= 0) {
                    dustParticles.splice(i, 1);
                }
            }
        }

        function updateTitleAnimation() {
            titleTimer++;

            switch (titleState) {
                case 'fade_in':
                    titleOpacity += 4;
                    if (titleOpacity >= 255) {
                        titleOpacity = 255;
                        titleState = 'hold';
                        titleTimer = 0;
                    }
                    break;

                case 'hold':
                    if (titleTimer > 250) {
                        if (Math.random() < 0.6) {
                            spawnTitleDust(1);
                        }
                    }
                    if (titleTimer >= 350) {
                        titleState = 'disintegrate';
                        titleTimer = 0;
                    }
                    break;

                case 'disintegrate':
                    titleOpacity -= 4;

                    if (titleOpacity > 0) {
                        for (let i = 0; i < 5; i++) {
                            spawnTitleDust(2);
                        }
                    }

                    if (titleOpacity <= 0) {
                        titleOpacity = 0;
                        titleState = 'wait';
                        titleTimer = 0;
                    }
                    break;

                case 'wait':
                    if (titleTimer >= 150) {
                        titleState = 'fade_in';
                        titleTimer = 0;
                    }
                    break;
            }

            titleContainer.style.opacity = (titleOpacity / 255).toFixed(2);
            updateDustParticles();
        }

        // -------------------------------------------------------------------------
        // 3. MODAL YOUTUBE DEMO REEL
        // -------------------------------------------------------------------------
        const demoReelBtn = document.getElementById('demoReelBtn');
        const videoModal = document.getElementById('videoModal');
        const closeVideoBtn = document.getElementById('closeVideoBtn');
        const youtubeIframe = document.getElementById('youtubeIframe');

        const videoUrl = "https://www.youtube.com/embed/O8SmeeWGd3Q?autoplay=1";

        demoReelBtn.addEventListener('click', (e) => {
            e.preventDefault();
            youtubeIframe.src = videoUrl;
            videoModal.classList.add('active');
        });

        function closeVideo() {
            videoModal.classList.remove('active');
            setTimeout(() => {
                youtubeIframe.src = "";
            }, 400);
        }

        closeVideoBtn.addEventListener('click', closeVideo);

        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) {
                closeVideo();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && videoModal.classList.contains('active')) {
                closeVideo();
            }
        });

        // -------------------------------------------------------------------------
        // 4. SLASH AU CLIC SOURIS
        // -------------------------------------------------------------------------
        window.addEventListener('mousedown', (e) => {
            const slash = document.createElement('div');
            slash.className = 'slash-effect';
            slash.style.left = e.clientX + 'px';
            slash.style.top = e.clientY + 'px';
            document.body.appendChild(slash);

            setTimeout(() => slash.remove(), 220);
        });

        // -------------------------------------------------------------------------
        // 5. BOUCLE PRINCIPALE
        // -------------------------------------------------------------------------
        let frameCount = 0;
        function loop() {
            frameCount++;
            ctx.clearRect(0, 0, width, height);

            updateAndDrawBgParticles(frameCount);
            updateTitleAnimation();

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
