<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Guegant Adventures</title>
    <!-- Police manuscrite similaire au visuel -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka+One&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Curseur natif masqué pour notre personnage */
            user-select: none;
        }

        body {
            background-color: #174044;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* Canvas pour les particules (étincelles et effet Thanos) */
        #effectsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Container du Titre */
        .title-container {
            text-align: center;
            position: relative;
            z-index: 5;
            margin-bottom: 60px;
        }

        .main-title {
            font-family: 'Pacifico', cursive;
            font-size: 4.8rem;
            color: #ffffff;
            margin-bottom: -10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: opacity 0.1s linear, filter 0.1s linear;
        }

        .subtitle {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: opacity 0.1s linear, filter 0.1s linear;
        }

        /* Menu style Title Screen */
        .game-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 5;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: transform 0.2s ease, color 0.2s ease, text-shadow 0.2s ease;
        }

        .btn-projets { font-size: 2.2rem; }
        .btn-demo { font-size: 1.6rem; }
        .btn-about { font-size: 1.2rem; }

        .menu-btn:hover {
            color: #ffd700;
            transform: scale(1.1);
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        /* Curseur Personnage / Epée */
        #customCursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
            transition: transform 0.05s ease-out;
        }

        /* Sprite du personnage (Épée pixel art ou icône) */
        .cursor-sprite {
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><path d="M7.1 19.8l-1.4-1.4 10.6-10.6-2.1-2.1 1.4-1.4 4.2 4.2-1.4 1.4-2.1-2.1z"/><path d="M5 20h2v2H5z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Animation Slash lors du clic */
        .slash-effect {
            position: fixed;
            pointer-events: none;
            z-index: 998;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            border-top-color: #ffd700;
            border-right-color: transparent;
            transform: translate(-50%, -50%) rotate(-45deg) scale(0.2);
            animation: slashAnim 0.25s ease-out forwards;
        }

        @keyframes slashAnim {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-45deg) scale(0.3);
                box-shadow: 0 0 20px #ffd700;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(135deg) scale(1.4);
                box-shadow: 0 0 0px transparent;
            }
        }
    </style>
</head>
<body>

    <canvas id="effectsCanvas"></canvas>

    <div class="title-container" id="titleContainer">
        <h1 class="main-title" id="mainTitle">Samuel Guegant</h1>
        <h2 class="subtitle" id="subTitle">Adventures</h2>
    </div>

    <nav class="game-menu">
        <a href="#projets" class="menu-btn btn-projets">PROJETS</a>
        <a href="#demoreel" class="menu-btn btn-demo">DEMO REEL</a>
        <a href="#about" class="menu-btn btn-about">ABOUT ME</a>
    </nav>

    <!-- Curseur Personnage -->
    <div id="customCursor">
        <div class="cursor-sprite"></div>
    </div>

    <script>
        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');
        const titleContainer = document.getElementById('titleContainer');
        const cursor = document.getElementById('customCursor');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- GESTION DU CURSEUR ET DU SLASH ---
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        window.addEventListener('mousedown', (e) => {
            // Création de l'effet d'attaque Slash
            const slash = document.createElement('div');
            slash.className = 'slash-effect';
            slash.style.left = e.clientX + 'px';
            slash.style.top = e.clientY + 'px';
            document.body.appendChild(slash);

            setTimeout(() => slash.remove(), 250);

            // Génération de petites étincelles de coup au clic
            createImpactSparks(e.clientX, e.clientY);
        });

        // --- SYSTEME DE PARTICULES ET ANIMATION CYCLE (7 SECONDES) ---
        let particles = [];

        function createImpactSparks(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color: '#ffd700',
                    alpha: 1,
                    decay: 0.04
                });
            }
        }

        function createTitleGoldSparkles() {
            const rect = titleContainer.getBoundingClientRect();
            if (rect.width === 0) return;
            particles.push({
                x: rect.left + Math.random() * rect.width,
                y: rect.top + Math.random() * rect.height,
                vx: (Math.random() - 0.5) * 1,
                vy: -Math.random() * 1.5 - 0.5,
                size: Math.random() * 3 + 1,
                color: '#fff5a5',
                alpha: 1,
                decay: 0.02
            });
        }
