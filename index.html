		<style>
			/* Vidéo en haut grand format */
			.hero-video {
				width: 100%;
				position: relative;
				padding-bottom: 56.25%; /* Ratio 16:9 */
				height: 0;
				background: #000;
				overflow: hidden;
			}
			.hero-video iframe {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				border: 0;
			}

			/* Section des bulles grands formats centrées */
			.bubbles-section {
				padding: 80px 40px;
				text-align: center;
				background: #1c2229;
				width: 100%;
			}
			.bubbles-container {
				display: flex;
				justify-content: space-evenly;
				align-items: center;
				gap: 40px;
				flex-wrap: wrap;
				max-width: 1200px;
				margin: 0 auto;
				width: 100%;
			}
			.bubble-item {
				width: 230px;
				height: 230px;
				border-radius: 50%;
				border: 3px solid #00b4d8;
				background: rgba(30, 35, 45, 0.85);
				display: flex;
				align-items: center;
				justify-content: center;
				color: #ffffff;
				text-decoration: none;
				font-size: 1.35rem;
				font-weight: bold;
				text-align: center;
				padding: 20px;
				transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
				box-shadow: 0 8px 25px rgba(0,0,0,0.5);
			}
			.bubble-item:hover {
				transform: scale(1.08);
				border-color: #90e0ef;
				box-shadow: 0 0 30px rgba(0, 180, 216, 0.7);
				color: #ffffff;
			}

			@media screen and (max-width: 980px) {
				.bubble-item {
					width: 170px;
					height: 170px;
					font-size: 1.1rem;
				}
			}

			@media screen and (max-width: 640px) {
				.bubble-item {
					width: 140px;
					height: 140px;
					font-size: 0.95rem;
				}
				.bubbles-container {
					gap: 20px;
				}
			}
		</style>
