<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Guegant Adventures</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #174044;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            position: relative;
            
            /* Curseur personnalisé basé sur ton dossier GitHub */
            cursor: url('images/MouseIcon.png'), auto;
        }

        /* Application du curseur sur tous les éléments interactifs */
        a, button, .menu-btn {
            cursor: url('images/MouseIcon.png'), pointer !important;
        }

        /* Canvas pour les particules et la poussière du Titre */
        #effectsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Conteneur du Titre */
        .title-container {
            text-align: center;
            position: relative;
            z-index: 5;
            margin-bottom: 50px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .main-title {
            font-family: 'Pacifico', cursive;
            font-size: 4.8rem;
            color: #ffffff;
            margin-bottom: -10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .subtitle {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Menu style Title Screen */
        .game-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 5;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            opacity: 0.7;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease, text-shadow 0.25s ease;
        }

        .btn-projets { font-size: 2.2rem; }
        .btn-demo { font-size: 1.6rem; }
        .btn-about { font-size: 1.2rem; }

        .menu-btn:hover {
            opacity: 1;
            transform: scale(1.18);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 25px rgba(212, 136, 0, 0.6);
        }

        /* Slash d'épée au clic */
        .slash-effect {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            border-top-color: #ffd700;
            border-right-color: transparent;
            transform: translate(-50%, -50%) rotate(-45deg) scale(0.2);
            animation: slashAnim 0.22s ease-out forwards;
        }

        @keyframes slashAnim {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-45deg) scale(0.3);
                box-shadow: 0 0 15px #ffd700;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(135deg) scale(1.3);
                box-shadow: 0 0 0px transparent;
            }
        }
    </style>
</head>
<body>

    <canvas id="effectsCanvas"></canvas>

    <div class="title-container" id="titleContainer">
        <h1 class="main-title">Samuel Guegant</h1>
        <h2 class="subtitle">Adventures</h2>
    </div>

    <nav class="game-menu">
        <a href="#projets" class="menu-btn btn-projets">PROJETS</a>
        <a href="#demoreel" class="menu-btn btn-demo">DEMO REEL</a>
        <a href="#about" class="menu-btn btn-about">ABOUT ME</a>
    </nav>

    <script>
        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');
        const titleContainer = document.getElementById('titleContainer');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // -------------------------------------------------------------------------
        // 1. PARTICULES DE FOND AMBIANTES
        // -------------------------------------------------------------------------
        const bgParticles = [];
        const BG_PARTICLE_COUNT = 35;

        for (let i = 0; i < BG_PARTICLE_COUNT; i++) {
            bgParticles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                speedY: 0.2 + Math.random() * 0.4,
                speedX: (Math.random() - 0.5) * 0.2,
                opacity: Math.random() * 0.7 + 0.2,
                baseOpacity: Math.random() * 0.7 + 0.2,
                pulseSpeed: 0.01 + Math.random() * 0.02,
                size: Math.random() * 4 + 2
            });
        }

        function updateAndDrawBgParticles(frameCount) {
            for (let p of bgParticles) {
                p.y -= p.speedY;
                p.x += p.speedX;
                p.opacity = p.baseOpacity + Math.sin(frameCount * p.pulseSpeed) * 0.2;

                if (p.y < -20) {
                    p.y = height + 10;
                    p.x = Math.random() * width;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.opacity);
                
                const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // -------------------------------------------------------------------------
        // 2. ANIMATION TITRE & THANOS DUST
        // -------------------------------------------------------------------------
        let titleState = 'fade_in';
        let titleTimer = 0;
        let titleOpacity = 0;
        const dustParticles = [];

        function spawnTitleDust(intensity) {
            const rect = titleContainer.getBoundingClientRect();
            
            const rx = (Math.random() - 0.5) * (rect.width || 400);
            const ry = (Math.random() - 0.5) * (rect.height || 100);

            dustParticles.push({
                x: (rect.left + (rect.width / 2) || width / 2) + rx,
                y: (rect.top + (rect.height / 2) || height / 3) + ry,
                vx: (Math.random() * 1.8 + 0.4) * intensity,
                vy: -(Math.random() * 1.6 + 0.4) * intensity,
                opacity: 200,
                life: 45 + Math.random() * 30,
                size: Math.floor(2 + Math.random() * 3)
            });
        }

        function updateDustParticles() {
            for (let i = dustParticles.length - 1; i >= 0; i--) {
                const p = dustParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.opacity -= 4;
                p.life--;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.opacity / 255);
                ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();

                if (p.opacity <= 0 || p.life <= 0) {
                    dustParticles.splice(i, 1);
                }
            }
        }

        function updateTitleAnimation() {
            titleTimer++;

            switch (titleState) {
                case 'fade_in':
                    titleOpacity += 4;
                    if (titleOpacity >= 255) {
                        titleOpacity = 255;
                        titleState = 'hold';
                        titleTimer = 0;
                    }
                    break;

                case 'hold':
                    if (titleTimer > 250) {
                        if (Math.random() < 0.6) {
                            spawnTitleDust(1);
                        }
                    }
                    if (titleTimer >= 350) {
                        titleState = 'disintegrate';
                        titleTimer = 0;
                    }
                    break;

                case 'disintegrate':
                    titleOpacity -= 4;

                    if (titleOpacity > 0) {
                        for (let i = 0; i < 5; i++) {
                            spawnTitleDust(2);
                        }
                    }

                    if (titleOpacity <= 0) {
                        titleOpacity = 0;
                        titleState = 'wait';
                        titleTimer = 0;
                    }
                    break;

                case 'wait':
                    if (titleTimer >= 150) {
                        titleState = 'fade_in';
                        titleTimer = 0;
                    }
                    break;
            }

            titleContainer.style.opacity = (titleOpacity / 255).toFixed(2);
            updateDustParticles();
        }

        // -------------------------------------------------------------------------
        // 3. SLASH AU CLIC SOURIS
        // -------------------------------------------------------------------------
        window.addEventListener('mousedown', (e) => {
            const slash = document.createElement('div');
            slash.className = 'slash-effect';
            slash.style.left = e.clientX + 'px';
            slash.style.top = e.clientY + 'px';
            document.body.appendChild(slash);

            setTimeout(() => slash.remove(), 220);
        });

        // -------------------------------------------------------------------------
        // 4. BOUCLE PRINCIPALE
        // -------------------------------------------------------------------------
        let frameCount = 0;
        function loop() {
            frameCount++;
            ctx.clearRect(0, 0, width, height);

            updateAndDrawBgParticles(frameCount);
            updateTitleAnimation();

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
